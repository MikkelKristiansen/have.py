# Runtime-konfiguration for haven
# Tilpas felterne til din egen opsætning.

aktivt_år: 2026

stier:
  data: data
  out: out
  fotos: fotos

# Filer i data/{aktivt_år}/ der skal rendres som bede
bede: []

site:
  basis_url: "https://eksempel.dk"

features:
  ics_kalender: true
  rss_feeds: true

# Valgfri: vises i User-Agent ved download af billeder fra Wikimedia
# kontakt_email: din@email.dk

# Valgfri: eget forside-billede — bruges som hero-baggrund (sti relativt til projektroden)
# Mangler feltet bruges mørkegrøn baggrund som standard.
# hero_billede: fotos/min-have.jpg

# Ikon-billede per bed sættes i den pågældende beds YAML under meta:
#   meta:
#     ikon_billede: fotos/drivhus.jpg   # rund thumbnail — overstyrer emoji på kortet

deploy:
  # "sftp", "ftp" eller "ingen"
  protokol: ingen

  sftp:
    host: ""
    bruger: ""
    mappe: ""
    # Adgangskode: HAVE_SFTP_KODE miljøvariabel eller .env

  ftp:
    host: ""
    bruger: ""
    mappe: ""
    # Adgangskode: HAVE_FTP_KODE miljøvariabel eller .env
