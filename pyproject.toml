[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "haven"
description = "Statisk havesite-generator skrevet i Python"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Mikkel Kristiansen", email = "mester.kristiansen@gmail.com" },
]
keywords = ["garden", "have", "static-site-generator", "yaml", "jinja2"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Topic :: Internet :: WWW/HTTP :: Site Management",
    "Natural Language :: Danish",
]
version = "0.8.3"
dependencies = [
    "Jinja2>=3.0",
    "PyYAML>=6.0",
    "Pillow>=10.0",
    "livereload>=2.6",
    "python-dotenv>=1.0",
    "pydantic>=2.0",
    "ruamel-yaml>=0.18",
    "questionary>=2.0",
    "markdown>=3.0",
]

[project.urls]
Repository = "https://github.com/MikkelKristiansen/have.py"

[project.scripts]
have = "haven.cli:main"

[tool.setuptools.packages.find]
include = ["haven*"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.package-data]
haven = ["templates/*.html", "static/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]

